<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3DGS 模型编辑器 · 坐标拾取</title>
  <style>
    :root {
      --bg: #eef1f6;
      --bg-grad: linear-gradient(180deg, #f7f9fc 0%, #eaeef4 100%);
      --panel: #ffffff;
      --panel-2: #f6f8fb;
      --line: #e7ebf1;
      --line-2: #d7dee8;
      --txt: #1b2430;
      --muted: #6b7888;
      --accent: #2f6fed;
      --accent-d: #1f57cf;
      --accent-weak: rgba(47, 111, 237, .08);
      --accent-soft: rgba(47, 111, 237, .14);
      --ok: #15a06b;
      --warn: #e0892a;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .05);
      --shadow: 0 2px 6px rgba(16, 24, 40, .05), 0 10px 28px rgba(16, 24, 40, .08);
      --shadow-lg: 0 18px 50px rgba(16, 24, 40, .16);
      --ring: 0 0 0 3px rgba(47, 111, 237, .22);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; color: var(--txt);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; }

    /* ===== 头部 ===== */
    header { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 18px;
      background: linear-gradient(180deg, #ffffff, #f6f8fb);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 1px 4px rgba(16, 24, 40, .04);
      flex-wrap: wrap; }
    header::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px;
      background: linear-gradient(90deg, #1f57cf, #2f6fed 42%, #13a085); opacity: .9; }
    header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .4px; display: flex; align-items: center; }
    header .logo { display: inline-block; width: 15px; height: 15px; border-radius: 5px; margin-right: 8px;
      background: linear-gradient(135deg, #2f6fed, #13a085); box-shadow: 0 1px 4px rgba(47, 111, 237, .42); }
    header .sub { color: var(--muted); font-size: 12px; letter-spacing: .2px; }
    .spacer { flex: 1; }

    /* ===== 按钮 ===== */
    .btn { background: var(--panel); color: var(--txt); border: 1px solid var(--line-2);
      padding: 7px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 500;
      transition: .18s ease; box-shadow: var(--shadow-sm); }
    .btn:hover { border-color: var(--accent); color: var(--accent-d); box-shadow: var(--shadow); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .btn.primary { background: linear-gradient(180deg, #3a78f0, #2f6fed); color: #fff; border-color: transparent;
      font-weight: 600; box-shadow: 0 2px 8px rgba(47, 111, 237, .35); }
    .btn.primary:hover { background: linear-gradient(180deg, #2f6fed, #1f57cf); box-shadow: 0 4px 14px rgba(47, 111, 237, .42); color: #fff; }
    .btn.sm { padding: 5px 11px; font-size: 12px; }

    /* ===== 3D 视口 ===== */
    #viewer { position: relative; flex: 1; min-height: 0; background: var(--bg); }
    #drop-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none; color: var(--muted); font-size: 14px; opacity: 0; transition: opacity .15s; text-align: center; }
    #drop-hint.show { opacity: 1; background: var(--accent-weak); outline: 2px dashed var(--accent); outline-offset: -10px; }

    /* ===== 世界坐标点 ===== */
    #worldPins { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
    .wpin { position: absolute; transform: translate(-50%, -50%); pointer-events: none; will-change: left, top; }
    .wpin .wdot { width: 12px; height: 12px; border-radius: 50%; background: var(--c, #2f6fed);
      border: 2px solid #fff; box-shadow: 0 0 0 3px var(--accent-weak), 0 0 8px var(--c, #2f6fed); }
    .wpin .wlbl { position: absolute; left: 15px; top: -6px; white-space: nowrap; background: var(--panel);
      color: var(--txt); border: 1px solid var(--c, #2f6fed); padding: 2px 7px; border-radius: 6px; font-size: 11px;
      font-weight: 600; box-shadow: var(--shadow); }

    /* ===== 状态 / FPS / 提示 ===== */
    #status { position: absolute; left: 14px; bottom: 14px; font-size: 12px; color: var(--txt);
      background: rgba(255, 255, 255, .9); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
      box-shadow: var(--shadow-sm); backdrop-filter: blur(6px); z-index: 12; }
    #fps { position: absolute; right: 14px; bottom: 14px; font-size: 12px; font-variant-numeric: tabular-nums;
      color: var(--accent-d); font-weight: 600; background: rgba(255, 255, 255, .9); padding: 5px 12px;
      border-radius: 999px; border: 1px solid var(--line); box-shadow: var(--shadow-sm); backdrop-filter: blur(6px); z-index: 30; }
    #roamHelp { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: rgba(255, 255, 255, .94);
      border: 1px solid var(--accent); color: var(--txt); padding: 7px 14px; border-radius: 999px; font-size: 12px;
      z-index: 20; display: none; box-shadow: var(--shadow); backdrop-filter: blur(6px); }
    #roamHelp.show { display: block; }

    /* ===== 拾取面板 ===== */
    #pickPanel { position: absolute; right: 16px; top: 16px; width: 264px; background: rgba(255, 255, 255, .96);
      border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
      z-index: 20; font-size: 13px; backdrop-filter: blur(10px); }
    #pickPanel.hidden { display: none; }
    #pickPanel h3 { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: var(--txt); letter-spacing: .3px; }
    #pickPanel .hint { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0 0 10px; }
    .pk-list { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow: auto; }
    .pk-item { display: flex; align-items: center; gap: 7px; background: var(--panel-2); border: 1px solid var(--line);
      border-radius: var(--radius-sm); padding: 6px 9px; font-size: 12px; transition: .15s; }
    .pk-item:hover { border-color: var(--accent); }
    .pk-item .seq { font-weight: 700; color: var(--accent); flex: none; width: 28px; }
    .pk-item .xyz { flex: 1; font-variant-numeric: tabular-nums; color: var(--txt); }
    .pk-item .del { cursor: pointer; color: var(--muted); flex: none; transition: .15s; }
    .pk-item .del:hover { color: #e5484d; }
    .pk-acts { display: flex; gap: 6px; margin-top: 10px; }
    .pk-acts .btn { flex: 1; padding: 5px 8px; font-size: 12px; }
    .pk-empty { color: var(--muted); font-size: 12px; padding: 6px 0; }

    /* ===== 滚动条 ===== */
    .pk-list::-webkit-scrollbar { width: 8px; }
    .pk-list::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
    .pk-list::-webkit-scrollbar-thumb:hover { background: #c2ccd8; }
    .pk-list::-webkit-scrollbar-track { background: transparent; }

    /* ===== 移动端适配 (≤768px) ===== */
    @media (max-width: 768px) {
      html, body { font-size: 13px; }
      header { padding: 9px 12px; gap: 7px; }
      header h1 { font-size: 13.5px; }
      header .sub { display: none; }
      .btn { padding: 8px 13px; font-size: 13px; }
      .btn.sm { padding: 7px 10px; }
      #pickPanel { right: 10px; left: 10px; top: 10px; width: auto; max-width: none;
        padding: 11px; font-size: 12px; max-height: 44vh; }
      .pk-list { max-height: 30vh; }
      #status, #fps { font-size: 11px; padding: 4px 9px; bottom: 10px; }
      #status { left: 10px; }
      #fps { right: 10px; }
      #roamHelp { font-size: 11px; padding: 6px 11px; }
      .wpin .wlbl { font-size: 10px; padding: 1px 5px; left: 12px; }
    }
    @media (max-width: 420px) {
      header h1 { font-size: 12.5px; }
      #pickPanel { padding: 9px; }
    }
    /* ===== 运营中心 ===== */
    #opsCenter { position: fixed; top: 0; left: 0; bottom: 0; width: 372px; max-width: 94vw; background: var(--panel);
      border-right: 1px solid var(--line); box-shadow: var(--shadow-lg); transform: translateX(-100%);
      transition: transform .26s cubic-bezier(.2,.7,.2,1); z-index: 60; display: flex; flex-direction: column; }
    #opsCenter.open { transform: translateX(0); }
    .ops-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px;
      border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #ffffff, #f6f8fb);
      box-shadow: 0 1px 0 rgba(255,255,255,.6) inset; }
    .ops-head h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .ops-head h2::before { content: ''; width: 14px; height: 14px; border-radius: 4px;
      background: linear-gradient(135deg, #2f6fed, #13a085); box-shadow: 0 1px 4px rgba(47,111,237,.4); }
    .ops-close { border: none; background: transparent; font-size: 18px; color: var(--muted); cursor: pointer; line-height: 1; padding: 2px 6px; }
    .ops-close:hover { color: var(--accent); }
    .ops-kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 14px; }
    .kpi { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 4px; text-align: center; }
    .kpi-v { display: block; font-size: 19px; font-weight: 800; color: var(--txt); font-variant-numeric: tabular-nums; line-height: 1.1; }
    .kpi-v.warn { color: var(--warn); } .kpi-v.bad { color: #e5484d; } .kpi-v.ok { color: var(--ok); }
    .kpi-l { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
    .ops-tabs { display: flex; gap: 5px; padding: 0 14px 11px; border-bottom: 1px solid var(--line); }
    .ops-tabs button { flex: 1; padding: 8px 0; font-size: 13px; font-weight: 600; border: 1px solid var(--line-2);
      background: var(--panel); color: var(--muted); border-radius: 8px; cursor: pointer; transition: .15s; }
    .ops-tabs button.active { background: linear-gradient(180deg, #3a78f0, #2f6fed); color: #fff; border-color: transparent; box-shadow: 0 2px 8px rgba(47,111,237,.3); }
    .ops-body { flex: 1; overflow: auto; padding: 12px 14px; }
    .tab-pane { display: none; } .tab-pane.active { display: block; }
    .ops-tools { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
    .ops-tools input { flex: 1; min-width: 130px; padding: 7px 11px; border: 1px solid var(--line-2); border-radius: 8px; font-size: 13px; outline: none; }
    .ops-tools input:focus { border-color: var(--accent); box-shadow: var(--ring); }
    .chip { padding: 5px 11px; font-size: 12px; border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; cursor: pointer; color: var(--muted); transition: .15s; user-select: none; }
    .chip.active { background: var(--accent-weak); border-color: var(--accent); color: var(--accent-d); font-weight: 600; }
    .alarm { border: 1px solid var(--line); border-left: 3px solid var(--muted); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; background: var(--panel); }
    .alarm.lv-urgent { border-left-color: #e5484d; } .alarm.lv-major { border-left-color: var(--warn); } .alarm.lv-minor { border-left-color: var(--accent); }
    .alarm .a-top { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
    .alarm .lv { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; color: #fff; }
    .lv-urgent .lv { background: #e5484d; } .lv-major .lv { background: var(--warn); } .lv-minor .lv { background: var(--accent); }
    .alarm .dev { font-weight: 700; font-size: 13px; } .alarm .time { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
    .alarm .desc { font-size: 12px; color: var(--txt); margin: 3px 0 7px; line-height: 1.5; }
    .alarm .a-bot { display: flex; align-items: center; gap: 8px; }
    .alarm .st { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); }
    .alarm .st.s-ack { color: var(--accent-d); border-color: var(--accent); background: var(--accent-weak); }
    .alarm .st.s-ok { color: var(--ok); border-color: var(--ok); }
    .alarm .ack { margin-left: auto; font-size: 12px; padding: 4px 12px; border: 1px solid var(--accent); background: var(--accent-weak); color: var(--accent-d); border-radius: 7px; cursor: pointer; font-weight: 600; }
    .alarm .ack:hover { background: var(--accent-soft); }
    .dev-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; margin-bottom: 8px; background: var(--panel); cursor: pointer; transition: .15s; }
    .dev-card:hover { border-color: var(--accent); }
    .dev-card .d-top { display: flex; align-items: center; gap: 7px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; } .dot.run { background: var(--ok); } .dot.stop { background: var(--muted); } .dot.fault { background: #e5484d; }
    .dev-card .nm { font-weight: 700; font-size: 13px; } .dev-card .no { margin-left: auto; font-size: 11px; color: var(--muted); }
    .dev-card .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .dev-card .d-detail { display: none; margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line-2); font-size: 12px; color: var(--txt); line-height: 1.8; }
    .dev-card.open .d-detail { display: block; }
    .dev-card .mark { margin-top: 8px; font-size: 12px; color: var(--accent-d); cursor: pointer; font-weight: 600; }
    .dev-card .mark:hover { text-decoration: underline; }
    .insp { border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; margin-bottom: 8px; background: var(--panel); cursor: pointer; transition: .15s; }
    .insp:hover { border-color: var(--accent); }
    .insp .i-top { display: flex; align-items: center; gap: 7px; }
    .insp .nm { font-weight: 700; font-size: 13px; } .insp .st { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
    .insp .st.on { color: var(--ok); border: 1px solid var(--ok); background: rgba(21,160,107,.08); } .insp .st.off { color: var(--muted); border: 1px solid var(--line-2); }
    .insp .sub { font-size: 12px; color: var(--muted); margin: 4px 0 7px; }
    .insp .prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .insp .prog > i { display: block; height: 100%; background: linear-gradient(90deg, #2f6fed, #13a085); }
    .insp .route { display: none; margin-top: 8px; font-size: 12px; color: var(--txt); }
    .insp.open .route { display: block; }
    .insp .route div { padding: 3px 0; border-bottom: 1px dashed var(--line-2); }
    .ops-empty { color: var(--muted); font-size: 12px; padding: 10px 2px; text-align: center; }

    @media (max-width: 768px) {
      #opsCenter { width: 100%; max-width: 100%; border-right: none; }
      .ops-kpi { grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px 12px; }
      .kpi-v { font-size: 17px; }
      .ops-tabs button { padding: 7px 0; font-size: 12.5px; }
    }

  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1><span class="logo"></span>3DGS 模型编辑器</h1>
      <span class="sub">拖入 / 选择高斯模型 · 点击表面拾取坐标</span>
      <div class="spacer"></div>
      <input id="file" type="file" accept=".ply,.splat,.ksplat,.spz" hidden />
      <button class="btn" id="loadBtn">选择模型</button>
      <button class="btn primary" id="realBtn">载入示例</button>
      <button class="btn" id="resetBtn">回到出生点</button>
      <button class="btn primary" id="opsBtn">运营中心</button>
      <label class="chk" style="display:inline-flex;align-items:center;gap:5px;color:var(--txt);font-size:12px;cursor:pointer;user-select:none">
        <input type="checkbox" id="pickChk" style="margin:0;accent-color:var(--accent)" /> 选取坐标
      </label>
    </header>
    <div id="viewer">
      <div id="drop-hint">松开以加载高斯泼溅模型<br/>（支持 .ply / .splat / .ksplat / .spz）</div>
      <div id="worldPins"></div>
      <div id="status">就绪 · 拖入模型或点击「载入示例」</div>
      <div id="fps">– FPS</div>
      <div id="roamHelp">第一人称模式（碰撞已开启）：WASD 移动 · Q/E 升降 · 拖拽鼠标转向</div>
      <div id="pickPanel">
        <h3>拾取坐标</h3>
        <p class="hint">开启「选取坐标」后，在模型表面单击即可记录该点的 X / Y / Z 世界坐标。</p>
        <div class="pk-list" id="pkList"><div class="pk-empty">尚未拾取任何坐标</div></div>
        <div class="pk-acts">
          <button class="btn" id="copyPickBtn">复制全部</button>
          <button class="btn" id="clearPickBtn">清空</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 运营中心（报警 / 设备台账 / 巡检人员） ===== -->
  <div id="opsCenter">
    <div class="ops-head">
      <h2>运营中心</h2>
      <button class="ops-close" id="opsClose" title="关闭">✕</button>
    </div>
    <div class="ops-kpi">
      <div class="kpi"><span class="kpi-v" id="kDev">–</span><span class="kpi-l">设备</span></div>
      <div class="kpi"><span class="kpi-v ok" id="kRun">–</span><span class="kpi-l">运行中</span></div>
      <div class="kpi"><span class="kpi-v bad" id="kFault">–</span><span class="kpi-l">故障</span></div>
      <div class="kpi"><span class="kpi-v warn" id="kAlarm">–</span><span class="kpi-l">未处理报警</span></div>
      <div class="kpi"><span class="kpi-v" id="kInsp">–</span><span class="kpi-l">巡检完成</span></div>
      <div class="kpi"><span class="kpi-v" id="kShift">早</span><span class="kpi-l">当前班次</span></div>
    </div>
    <div class="ops-tabs">
      <button data-tab="alarm" class="active">报警</button>
      <button data-tab="ledger">设备台账</button>
      <button data-tab="inspect">巡检人员</button>
    </div>
    <div class="ops-body">
      <div id="tab-alarm" class="tab-pane active">
        <div class="ops-tools" id="alarmFilter">
          <span class="chip active" data-lv="all">全部</span>
          <span class="chip" data-lv="urgent">紧急</span>
          <span class="chip" data-lv="major">重要</span>
          <span class="chip" data-lv="minor">一般</span>
        </div>
        <div id="alarmList"></div>
      </div>
      <div id="tab-ledger" class="tab-pane">
        <div class="ops-tools"><input id="ledgerSearch" placeholder="搜索设备名 / 编号 / 型号" /></div>
        <div id="ledgerList"></div>
      </div>
      <div id="tab-inspect" class="tab-pane">
        <div class="ops-tools" id="shiftFilter">
          <span class="chip active" data-sh="早">早班</span>
          <span class="chip" data-sh="中">中班</span>
          <span class="chip" data-sh="晚">晚班</span>
        </div>
        <div id="inspList"></div>
      </div>
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "/TJ.github.io/heatstation/node_modules/three/build/three.module.js" } }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
