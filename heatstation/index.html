<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>换热站数字孪生 · 坐标拾取</title>
  <style>
    :root {
      --bg: #eef1f6;
      --bg-grad: linear-gradient(180deg, #f7f9fc 0%, #eaeef4 100%);
      --panel: #ffffff;
      --panel-2: #f6f8fb;
      --line: #e7ebf1;
      --line-2: #d7dee8;
      --txt: #1b2430;
      --muted: #6b7888;
      --accent: #2f6fed;
      --accent-d: #1f57cf;
      --accent-weak: rgba(47, 111, 237, .08);
      --accent-soft: rgba(47, 111, 237, .14);
      --ok: #15a06b;
      --warn: #e0892a;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .05);
      --shadow: 0 2px 6px rgba(16, 24, 40, .05), 0 10px 28px rgba(16, 24, 40, .08);
      --shadow-lg: 0 18px 50px rgba(16, 24, 40, .16);
      --ring: 0 0 0 3px rgba(47, 111, 237, .22);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; color: var(--txt);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; }

    /* ===== 头部 ===== */
    header { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 18px;
      background: linear-gradient(180deg, #ffffff, #f6f8fb);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 1px 4px rgba(16, 24, 40, .04);
      flex-wrap: wrap; }
    header::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px;
      background: linear-gradient(90deg, #1f57cf, #2f6fed 42%, #13a085); opacity: .9; }
    header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .4px; display: flex; align-items: center; }
    header .logo { display: inline-block; width: 15px; height: 15px; border-radius: 5px; margin-right: 8px;
      background: linear-gradient(135deg, #2f6fed, #13a085); box-shadow: 0 1px 4px rgba(47, 111, 237, .42); }
    header .sub { color: var(--muted); font-size: 12px; letter-spacing: .2px; }
    .spacer { flex: 1; }

    /* ===== 按钮 ===== */
    .btn { background: var(--panel); color: var(--txt); border: 1px solid var(--line-2);
      padding: 7px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 500;
      transition: .18s ease; box-shadow: var(--shadow-sm); }
    .btn:hover { border-color: var(--accent); color: var(--accent-d); box-shadow: var(--shadow); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .btn.primary { background: linear-gradient(180deg, #3a78f0, #2f6fed); color: #fff; border-color: transparent;
      font-weight: 600; box-shadow: 0 2px 8px rgba(47, 111, 237, .35); }
    .btn.primary:hover { background: linear-gradient(180deg, #2f6fed, #1f57cf); box-shadow: 0 4px 14px rgba(47, 111, 237, .42); color: #fff; }
    .btn.sm { padding: 5px 11px; font-size: 12px; }

    /* ===== 3D 视口 ===== */
    #viewer { position: relative; flex: 1; min-height: 0; background: var(--bg); }
    #drop-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none; color: var(--muted); font-size: 14px; opacity: 0; transition: opacity .15s; }
    #drop-hint.show { opacity: 1; background: var(--accent-weak); outline: 2px dashed var(--accent); outline-offset: -10px; }

    /* ===== 世界坐标点 ===== */
    #worldPins { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
    .wpin { position: absolute; transform: translate(-50%, -50%); pointer-events: none; will-change: left, top; }
    .wpin .wdot { width: 12px; height: 12px; border-radius: 50%; background: var(--c, #2f6fed);
      border: 2px solid #fff; box-shadow: 0 0 0 3px var(--accent-weak), 0 0 8px var(--c, #2f6fed); }
    .wpin .wlbl { position: absolute; left: 15px; top: -6px; white-space: nowrap; background: var(--panel);
      color: var(--txt); border: 1px solid var(--c, #2f6fed); padding: 2px 7px; border-radius: 6px; font-size: 11px;
      font-weight: 600; box-shadow: var(--shadow); }

    /* ===== 设备面板 ===== */
    #devicePanels { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
    .devpanel { position: absolute; transform-origin: bottom center; transform: translate(-50%, -100%) scale(1);
      min-width: 96px; max-width: 150px;
      background: rgba(255, 255, 255, .98);
      border: 1px solid var(--line); border-top: 3px solid var(--accent);
      border-radius: var(--radius); padding: 7px 11px 8px;
      box-shadow: var(--shadow);
      font-size: 11px; line-height: 1.45; backdrop-filter: blur(6px) saturate(1.1);
      transition: box-shadow .2s ease; }
    .devpanel:hover { box-shadow: var(--shadow-lg); }
    .devpanel::after { content: ''; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
      border: 7px solid transparent; border-top-color: var(--accent); }
    .devpanel.below::after { bottom: auto; top: -7px; border-top-color: transparent; border-bottom-color: var(--accent); }
    .devpanel .dp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .devpanel .dp-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none;
      box-shadow: 0 0 0 3px var(--accent-weak); }
    .devpanel .dp-name { font-weight: 700; font-size: 11.5px; color: var(--txt); white-space: nowrap; letter-spacing: .3px; }
    .devpanel .dp-rows { display: flex; flex-direction: column; gap: 2px; }
    .devpanel .dp-row { display: flex; justify-content: space-between; gap: 14px; font-size: 10.5px; }
    .devpanel .dp-row span { color: var(--muted); }
    .devpanel .dp-row b { color: var(--txt); font-weight: 600; font-variant-numeric: tabular-nums; }
    .devmarker { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
      border: 2px solid #fff; box-shadow: 0 0 0 3px var(--accent-weak), 0 0 8px var(--accent); transform: translate(-50%, -50%); pointer-events: none; }
    .devmarker b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #fff; font-weight: 700; }
    .devleader { position: absolute; height: 2px; background: var(--accent); transform-origin: left center; opacity: .72; pointer-events: none;
      box-shadow: 0 0 6px var(--accent-weak); }
    .devleader::after { content: ''; position: absolute; right: -5px; top: -2px; width: 0; height: 0;
      border: 3px solid transparent; border-left: 5px solid var(--accent); }

    /* ===== 图例 ===== */
    #legend { position: absolute; left: 16px; top: 16px; background: rgba(255, 255, 255, .92);
      border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; box-shadow: var(--shadow);
      font-size: 12px; z-index: 15; display: flex; flex-direction: column; gap: 5px; backdrop-filter: blur(8px); }
    #legend .lg-title { font-size: 12px; font-weight: 700; color: var(--txt); margin-bottom: 2px; letter-spacing: .4px; }
    #legend .lg-row { display: flex; align-items: center; gap: 8px; color: var(--txt); }
    #legend .lg-row i { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(16, 24, 40, .05); }

    /* ===== 状态 / FPS / 提示 ===== */
    #status { position: absolute; left: 14px; bottom: 14px; font-size: 12px; color: var(--txt);
      background: rgba(255, 255, 255, .9); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
      box-shadow: var(--shadow-sm); backdrop-filter: blur(6px); z-index: 12; }
    #fps { position: absolute; right: 14px; bottom: 14px; font-size: 12px; font-variant-numeric: tabular-nums;
      color: var(--accent-d); font-weight: 600; background: rgba(255, 255, 255, .9); padding: 5px 12px;
      border-radius: 999px; border: 1px solid var(--line); box-shadow: var(--shadow-sm); backdrop-filter: blur(6px); z-index: 30; }
    #roamHelp { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: rgba(255, 255, 255, .94);
      border: 1px solid var(--accent); color: var(--txt); padding: 7px 14px; border-radius: 999px; font-size: 12px;
      z-index: 20; display: none; box-shadow: var(--shadow); backdrop-filter: blur(6px); }
    #roamHelp.show { display: block; }

    /* ===== 拾取面板 ===== */
    #pickPanel { position: absolute; right: 16px; top: 16px; width: 264px; background: rgba(255, 255, 255, .96);
      border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
      z-index: 20; font-size: 13px; backdrop-filter: blur(10px); }
    #pickPanel.hidden { display: none; }
    #pickPanel h3 { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: var(--txt); letter-spacing: .3px; }
    #pickPanel .hint { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0 0 10px; }
    .pk-list { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow: auto; }
    .pk-item { display: flex; align-items: center; gap: 7px; background: var(--panel-2); border: 1px solid var(--line);
      border-radius: var(--radius-sm); padding: 6px 9px; font-size: 12px; transition: .15s; }
    .pk-item:hover { border-color: var(--accent); }
    .pk-item .seq { font-weight: 700; color: var(--accent); flex: none; width: 28px; }
    .pk-item .xyz { flex: 1; font-variant-numeric: tabular-nums; color: var(--txt); }
    .pk-item .del { cursor: pointer; color: var(--muted); flex: none; transition: .15s; }
    .pk-item .del:hover { color: #e5484d; }
    .pk-acts { display: flex; gap: 6px; margin-top: 10px; }
    .pk-acts .btn { flex: 1; padding: 5px 8px; font-size: 12px; }
    .pk-empty { color: var(--muted); font-size: 12px; padding: 6px 0; }

    /* ===== 自动导览 UI ===== */
    #tourUI { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); width: min(720px, 92%);
      z-index: 40; display: flex; flex-direction: column; gap: 7px; pointer-events: none; }
    #tourUI.hidden { display: none; }
    #tourProgWrap { height: 4px; background: rgba(255, 255, 255, .6); border-radius: 999px; overflow: hidden; box-shadow: var(--shadow-sm); }
    #tourProg { height: 100%; width: 0%; background: linear-gradient(90deg, #1f57cf, #2f6fed); transition: width .12s linear; }
    #tourBar { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, .97);
      border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow);
      pointer-events: auto; backdrop-filter: blur(10px); }
    #tourCaption { flex: 1; font-size: 13.5px; line-height: 1.55; color: var(--txt); font-weight: 500; }
    #tourCtrls { display: flex; gap: 6px; flex: none; }

    /* ===== 总结 / 未来卡片 ===== */
    #futureCard, #endCard { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 35;
      background: rgba(255, 255, 255, .98); border: 1px solid var(--line); border-radius: 18px; padding: 22px 32px;
      box-shadow: var(--shadow-lg); text-align: center; pointer-events: none; backdrop-filter: blur(14px); }
    #futureCard { border-top: 3px solid var(--accent); }
    #futureCard.hidden, #endCard.hidden { display: none; }
    #futureCard:not(.hidden), #endCard:not(.hidden) { animation: cardIn .55s cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes cardIn { from { opacity: 0; transform: translate(-50%, -46%) scale(.96); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    #futureCard .fc-title, #endCard .ec-title { font-size: 19px; font-weight: 800; color: var(--txt); margin-bottom: 14px; letter-spacing: .5px; }
    #futureCard .fc-list { display: flex; flex-direction: column; gap: 9px; }
    #futureCard .fc-list span { font-size: 13px; color: var(--accent-d); background: var(--accent-weak);
      border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 16px; font-weight: 500; }
    #endCard .ec-sub { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    #endCard .ec-tag { font-size: 12.5px; color: var(--txt); }

    /* ===== 滚动条 ===== */
    .pk-list::-webkit-scrollbar { width: 8px; }
    .pk-list::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
    .pk-list::-webkit-scrollbar-thumb:hover { background: #c2ccd8; }
    .pk-list::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1><span class="logo"></span>换热站数字孪生</h1>
      <span class="sub">点击模型表面拾取坐标</span>
      <div class="spacer"></div>
      <input id="file" type="file" accept=".ply,.splat,.ksplat,.spz" hidden />
      <button class="btn" id="loadBtn">选择模型</button>
      <button class="btn primary" id="realBtn">已摆正</button>
      <button class="btn" id="resetBtn">回到出生点</button>
      <button class="btn primary" id="tourBtn">▶ 自动导览</button>
      <label class="chk" style="display:inline-flex;align-items:center;gap:5px;color:var(--txt);font-size:12px;cursor:pointer;user-select:none">
        <input type="checkbox" id="pickChk" style="margin:0;accent-color:var(--accent)" /> 选取坐标
      </label>
    </header>
    <div id="viewer">
      <div id="drop-hint">松开以加载高斯泼溅模型</div>
      <div id="worldPins"></div>
      <div id="devicePanels"></div>
      <div id="legend">
        <div class="lg-title">设备图例</div>
        <div class="lg-row"><i style="background:#2b7cd3"></i>二级泵</div>
        <div class="lg-row"><i style="background:#13a085"></i>循环泵</div>
        <div class="lg-row"><i style="background:#e0821e"></i>补水泵</div>
        <div class="lg-row"><i style="background:#9b59b6"></i>液位传感器</div>
        <div class="lg-row"><i style="background:#e74c3c"></i>换热器</div>
        <div class="lg-row"><i style="background:#00bcd4"></i>热表</div>
      </div>
      <div id="status">就绪</div>
      <div id="fps">– FPS</div>
      <div id="roamHelp">第一人称模式（碰撞已开启）：WASD 移动 · Q/E 升降 · 拖拽鼠标转向</div>
      <div id="pickPanel">
        <h3>拾取坐标</h3>
        <p class="hint">开启「选取坐标」后，在模型表面单击即可记录该点的 X / Y / Z 世界坐标。</p>
        <div class="pk-list" id="pkList"><div class="pk-empty">尚未拾取任何坐标</div></div>
        <div class="pk-acts">
          <button class="btn" id="copyPickBtn">复制全部</button>
          <button class="btn" id="clearPickBtn">清空</button>
        </div>
      </div>
      <div id="tourUI" class="hidden">
        <div id="tourProgWrap"><div id="tourProg"></div></div>
        <div id="tourBar">
          <div id="tourCaption"></div>
          <div id="tourCtrls">
            <button class="btn" id="tourReplay">↻ 重播</button>
            <button class="btn" id="tourExit">■ 退出</button>
          </div>
        </div>
      </div>
      <div id="futureCard" class="hidden">
        <div class="fc-title">未来规划</div>
        <div class="fc-list">
          <span>对接 SCADA / PLC · 实时告警</span>
          <span>巡检工单 · 一键派单</span>
          <span>集团级 · 多站点统一管控</span>
        </div>
      </div>
      <div id="endCard" class="hidden">
        <div class="ec-title">换热站数字孪生</div>
        <div class="ec-sub">从「可视」走向「可管、可控」</div>
        <div class="ec-tag">让每一份热能、每一笔成本，清晰可溯</div>
      </div>
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "./node_modules/three/build/three.module.js" } }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
